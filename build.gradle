plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'com.gradleup.shadow' version '9.0.0'
    id 'xyz.jpenilla.run-paper' version '3.0.2'
}

repositories {
    mavenCentral()
    maven {
        name = 'PaperMC'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paper_api_version}"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
}

group = rootProject.group
version = rootProject.version

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(17)
}

runPaper {
    version = paper_api_version
}

jar {
    // The standalone jar without the Kotlin runtime is not usable, so we only
    // publish the shadow jar produced below.
    enabled = false
}

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
    relocate 'kotlin', 'com.indogeek.deathroulette.repackage.kotlin'

    manifest {
        attributes 'Multi-Release': 'true'
    }
}

build {
    dependsOn shadowJar
}

processResources {
    def version = project.version
    inputs.property 'version', version

    filesMatching('plugin.yml') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}
