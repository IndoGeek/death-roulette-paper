plugins {
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.shadow)
    alias(libs.plugins.run.paper)
}

group = 'com.indogeek.deathroulette'
version = '1.0.0'

description = 'Paper plugin that periodically kills a random player or a mob near them.'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly libs.paper.api
    implementation libs.kotlin.stdlib
}

kotlin {
    jvmToolchain(libs.versions.java.get().toInteger())

    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(libs.versions.java.get())
        // Treat every compiler warning as a build failure so the source tree stays clean.
        allWarningsAsErrors = true
        extraWarnings = true
        progressiveMode = true
    }
}

tasks.named('processResources') {
    def props = [version: version, apiVersion: libs.versions.minecraft.get()]
    inputs.properties props
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

tasks.named('jar') {
    // Only the shaded jar is usable: it carries the relocated Kotlin runtime.
    enabled = false
}

tasks.named('shadowJar') {
    archiveBaseName = 'DeathRoulette'
    archiveClassifier = ''
    mergeServiceFiles()
    relocate 'kotlin', 'com.indogeek.deathroulette.libs.kotlin'
    // Let the Kotlin module metadata transformer see every entry before merging them.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // The plugin is loaded from the class path, never the module path.
    exclude 'META-INF/versions/*/module-info.class'
    manifest {
        attributes 'Multi-Release': 'true'
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('runServer') {
    minecraftVersion libs.versions.minecraft.get()
}
